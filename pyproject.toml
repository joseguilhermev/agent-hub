[project]
name = "agent-hub"
version = "0.1.0"
description = "Minimal API for chatting with multiple Copilot Studio agents"
readme = "README.md"
authors = [
    { name = "José Guilherme", email = "joseguilherme.s.vasconcelos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=45.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
]

[project.scripts]
agent-hub = "agent_hub.main:main"
agent-hub-api = "agent_hub.api:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
